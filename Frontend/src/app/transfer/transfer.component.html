<div
  class="transfer-container mat-elevation-z4"
  style="padding: 24px; border-radius: 12px; background-color: #f9f9f9"
>
  <h2
    style="
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 600;
    "
  >
    🧳 Transfer Requests
  </h2>

  <!-- Show a fallback message if no data -->

  <div
    *ngIf="transferRequests.length === 0"
    style="text-align: center; padding: 20px; font-size: 18px"
  >
    <mat-icon style="vertical-align: middle; color: #aaa">info</mat-icon> No
    transfer requests found.
  </div>

  <!-- Material Table -->

  <table
    mat-table
    [dataSource]="transferRequests"
    class="mat-elevation-z8"
    *ngIf="transferRequests.length > 0"
    style="width: 100%; border-radius: 8px; overflow: hidden"
  >
    <!-- Request Id -->

    <ng-container matColumnDef="requestId">
      <th mat-header-cell *matHeaderCellDef>Request ID</th>

      <td mat-cell *matCellDef="let request">{{ request.requestId }}</td>
    </ng-container>

    <!-- Employee ID Column -->

    <ng-container matColumnDef="employeeId">
      <th mat-header-cell *matHeaderCellDef>Employee ID</th>

      <td mat-cell *matCellDef="let request">{{ request.employeeId }}</td>
    </ng-container>

    <!-- Job ID Column -->

    <ng-container matColumnDef="jobId">
      <th mat-header-cell *matHeaderCellDef>Job ID</th>

      <td mat-cell *matCellDef="let request">{{ request.jobId }}</td>
    </ng-container>

    <!-- From Manager Column -->

    <ng-container matColumnDef="fromManagerId">
      <th mat-header-cell *matHeaderCellDef>From Manager</th>

      <td mat-cell *matCellDef="let request">{{ request.fromManagerId }}</td>
    </ng-container>

    <!-- Status Column -->

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>

      <td mat-cell *matCellDef="let request">
        <mat-chip [color]="getStatusColor(request.status)" selected>
          {{ request.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Actions Column -->

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td
        mat-cell
        *matCellDef="let request"
        style="display: flex; gap: 8px; align-items: center"
      >
        <button mat-stroked-button (click)="viewDetails(request)">
          <mat-icon>visibility</mat-icon> View
        </button>

        <button
          mat-icon-button
          color="primary"
          (click)="accept(request)"
          matTooltip="Accept"
        >
          <mat-icon>check_circle</mat-icon>
        </button>

        <button
          mat-icon-button
          color="warn"
          (click)="reject(request)"
          matTooltip="Reject"
        >
          <mat-icon>cancel</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
